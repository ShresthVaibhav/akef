site_name: akef
site_url: https://shresthvaibhav.github.io/akef/
site_description: Async Python wrapper for Arknights Endfield. SKPORT accounts, Enka profiles and final stats
repo_url: https://github.com/ShresthVaibhav/akef
repo_name: ShresthVaibhav/akef
edit_uri: edit/main/docs/
copyright: MIT licensed. Not affiliated with Hypergryph or Gryphline.

exclude_docs: |
  README.md

theme:
  name: material
  font:
    text: Barlow
    code: JetBrains Mono
  icon:
    logo: material/lightning-bolt
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

extra_css:
  - assets/extra.css

plugins:
  - search
  - glightbox:
      zoomable: true
      skip_classes:
        - no-zoom

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ShresthVaibhav/akef
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/akef/

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Client: client.md
  - Models: models.md
  - Enka and final stats: enka.md
  - How stats are checked: stats.md
  - Caching and logins: caching.md
  - Errors: errors.md
